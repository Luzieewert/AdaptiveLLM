<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Next Round</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="container">
    <h1 id="roundHeading"></h1>

    <div class="card">
        <p id="roundTitle"></p>
        <p id="roundDescription"></p>
        <button id="continueBtn">Continue</button>
    </div>
</div>

<script src="app.js"></script>
<script>
    const step = getCurrentStep();

    if (!step || step.type !== "chat") {
        goToCurrentStepPage();
    }

    const roundLabel = getBlockLabel(step.block);

    document.querySelector("h1").textContent = roundLabel;
    document.getElementById("roundTitle").textContent = `Topic: ${step.topic}`;

    document.getElementById("roundDescription").textContent =
        step.mode === "adaptive"
            ? "In this conversation, the assistant will respond based on the communication preferences you selected."
            : "In this conversation, you will chat with a standard version of the assistant.";

    document.getElementById("continueBtn").addEventListener("click", () => {
        window.location.href = "chat.html";
    });
</script>
</body>
</html>
